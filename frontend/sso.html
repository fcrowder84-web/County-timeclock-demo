<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Opening TimeClock</title><style>body{font-family:Arial,sans-serif;background:#eef2f7;margin:0;color:#1f2937;display:grid;min-height:100vh;place-items:center}.card{background:white;border-radius:14px;padding:34px;max-width:520px;box-shadow:0 4px 18px rgba(0,0,0,.14);text-align:center}h1{color:#1f3c5b}.error{color:#991b1b;background:#fee2e2;padding:14px;border-radius:8px}a{display:inline-block;margin-top:18px;background:#1f3c5b;color:white;padding:12px 18px;border-radius:8px;text-decoration:none}</style></head><body><main class="card"><h1>Opening TimeClock</h1><p id="status">Confirming your Employee Portal access…</p><div id="error" class="error" style="display:none"></div><a id="portalLink" href="https://employee.edgefieldcountysc.org/apps/timeclock/launch" style="display:none">Return to Employee Portal</a></main><script>async function exchangePortalToken(){const params=new URLSearchParams(window.location.hash.slice(1));const portalToken=params.get('token');const requestedReturn=String(params.get('return_to')||'index').toLowerCase();const destinations={index:'/index.html',employee:'/employee.html',timecard:'/timecard.html',supervisor:'/supervisor.html',payroll:'/payroll.html',mobile:'/mobile.html'};const destinationBase=destinations[requestedReturn]||destinations.index;const destination=`${destinationBase}?v=20260820-1645`;history.replaceState({},document.title,'/sso.html');if(!portalToken){showError('The Employee Portal login link is missing.');return}try{const response=await fetch('/api/auth/portal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:portalToken})});const data=await response.json();if(!response.ok||data.error){showError(data.error||'Employee Portal login failed.');return}localStorage.setItem('timeclock_token',data.token);window.location.replace(destination);}catch(err){showError('TimeClock could not complete Employee Portal login.')}}function showError(message){document.getElementById('status').style.display='none';const box=document.getElementById('error');box.textContent=message;box.style.display='block';document.getElementById('portalLink').style.display='inline-block'}exchangePortalToken();</script></body></html>
