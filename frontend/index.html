<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Edgefield County TimeClock</title><style>:root{--blue:#17324d;--blue2:#1f5f8b;--gold:#c9a34a;--bg:#f4f7fb;--card:#fff;--text:#1f2937;--muted:#667085;--line:#dbe3ee;--shadow:0 8px 24px rgba(22,38,60,.10)}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}.topbar{background:linear-gradient(90deg,var(--blue),#234c73);color:#fff;padding:15px 28px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.18)}.brand{display:flex;gap:12px;align-items:center}.mark{background:var(--gold);color:#13283e;border-radius:10px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-weight:800}.brand small{display:block;color:#d7e4f0;margin-top:2px}.page{max-width:1180px;margin:0 auto;padding:36px 24px}.hero{text-align:center;margin:12px auto 30px}.hero h1{font-size:38px;margin:0 0 10px}.hero p{color:var(--muted);font-size:18px;margin:0}.session,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.session{padding:20px 22px;margin-bottom:24px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}.card{padding:26px;text-align:left}.card h2{margin:0 0 8px;color:var(--blue)}.card p{color:var(--muted);min-height:48px;line-height:1.45}button,.button{background:var(--blue2);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.secondary{background:#e8eef5;color:var(--blue)}.actions{display:flex;gap:10px;flex-wrap:wrap}.hidden{display:none}.footer{text-align:center;color:var(--muted);padding:30px}@media(max-width:700px){.topbar{padding:14px 18px}.page{padding:24px 16px}.hero h1{font-size:30px}}</style></head><body><header class="topbar"><div class="brand"><span class="mark">EC</span><span><strong>Edgefield County</strong><small>TimeClock</small></span></div></header><main class="page"><section class="hero"><h1>Employee Timekeeping</h1><p>Clock in and out, review timecards, and manage payroll approvals.</p></section><section id="signedOut" class="session hidden"><div><strong>Employee Portal sign-in required</strong><br><span>Use your county Employee Portal account to open TimeClock.</span></div><a class="button" href="https://employee.edgefieldcountysc.org/apps/timeclock/launch">Sign In</a></section><section id="signedIn" class="session hidden"><div id="sessionUser"></div><div class="actions"><a class="button secondary" href="https://employee.edgefieldcountysc.org/dashboard">Return to Employee Portal</a><button onclick="signOut()">Sign Out</button></div></section><div id="appGrid" class="grid"></div></main><footer class="footer">Edgefield County TimeClock</footer><script src="/mobile-pairing.js?v=20260828-1"></script><script>const apiBase='/api';let permissions=new Set();function token(){return localStorage.getItem('timeclock_token')}function has(key){return permissions.has('app_admin')||permissions.has(key)}function hasAny(keys){return keys.some(has)}function addCard(title,description,url){document.getElementById('appGrid').insertAdjacentHTML('beforeend',`<section class="card"><h2>${title}</h2><p>${description}</p><a class="button" href="${url}">Open ${title}</a></section>`)}function renderSignedOut(){document.getElementById('signedOut').classList.remove('hidden');document.getElementById('signedIn').classList.add('hidden');document.getElementById('appGrid').innerHTML=''}async function loadSession(){if(!token()){renderSignedOut();return}try{const response=await fetch(`${apiBase}/me`,{headers:{Authorization:`Bearer ${token()}`}});if(!response.ok)throw new Error('Session unavailable');const data=await response.json();permissions=new Set(data.permissions||[]);document.getElementById('signedOut').classList.add('hidden');document.getElementById('signedIn').classList.remove('hidden');document.getElementById('sessionUser').innerHTML=`Signed in as <strong>${data.user.first_name} ${data.user.last_name}</strong><br><span>${data.user.department_name||data.user.department||'Unassigned'}</span>`;const grid=document.getElementById('appGrid');grid.innerHTML='';const employeeAccess=hasAny(['view_own_time','clock_in_out','submit_timecard','request_punch_correction']);const supervisorAccess=hasAny(['view_assigned_employees','view_department_time','view_live_status','approve_punch_correction','approve_timecard','return_timecard','edit_employee_time','view_timeclock_audit','manage_employee_timeclock_settings','manage_supervisor_assignments']);const payrollAccess=hasAny(['view_payroll_records','review_approved_timecards','edit_payroll_time','return_to_supervisor','reopen_timecard','finalize_timecard','finalize_pay_period','export_payroll','view_payroll_reports','view_all_timeclock_records']);if(employeeAccess||supervisorAccess||payrollAccess)addCard('Timecard','Review the two-week timesheet, punches, leave, corrections, and approvals in one view.','/timecard.html');if(employeeAccess&&has('clock_in_out'))addCard('Mobile Quick Punch','Fast phone clock in/out with fresh GPS and network audit capture.','/mobile.html');if(supervisorAccess)addCard('Supervisor Administration','Manage correction requests, employee status, approvals, and team settings.','/supervisor.html?v=20260820-1645');if(payrollAccess)addCard('Payroll Administration','Finalize payroll, run reports, print timecards, and export records.','/payroll.html?v=20260820-1645');if(!grid.children.length)grid.innerHTML='<section class="card"><h2>No functions assigned</h2><p>Your account can access TimeClock, but no TimeClock permissions are currently assigned.</p><a class="button secondary" href="https://employee.edgefieldcountysc.org/dashboard">Return to Employee Portal</a></section>';}catch(_){localStorage.removeItem('timeclock_token');renderSignedOut()}}function signOut(){window.location.href='/global-logout.html'}loadSession();</script></body></html>
