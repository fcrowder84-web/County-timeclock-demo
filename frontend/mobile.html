<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17324d">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>Edgefield County TimeClock</title>
  <style>
    :root{--blue:#17324d;--blue2:#1f5f8b;--bg:#eef3f8;--card:#fff;--text:#1f2937;--muted:#667085;--ok:#176b3a;--warn:#8a4b08}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
    .top{background:var(--blue);color:#fff;padding:18px 20px;text-align:center}.top strong{font-size:20px}.top small{display:block;margin-top:4px;color:#dbe8f3}
    main{max-width:520px;margin:0 auto;padding:22px 16px 34px}.card{background:var(--card);border-radius:18px;padding:24px;box-shadow:0 10px 30px rgba(26,43,64,.12);margin-bottom:16px}
    .state{text-align:center}.state h1{font-size:29px;margin:6px 0 8px}.muted{color:var(--muted)}.last{font-size:16px;line-height:1.45;margin-top:12px}
    .punch{width:100%;min-height:88px;border:0;border-radius:16px;background:var(--blue2);color:white;font-size:24px;font-weight:800;padding:18px;cursor:pointer;margin-top:20px}.punch:disabled{opacity:.55;cursor:not-allowed}
    .status{margin-top:16px;border-radius:12px;padding:12px 14px;background:#f4f6f8;line-height:1.4}.status.ok{color:var(--ok);background:#eaf7ef}.status.warn{color:var(--warn);background:#fff4e6}
    .links{display:flex;gap:10px;flex-wrap:wrap}.links a,.signin{display:inline-block;text-decoration:none;border-radius:10px;padding:11px 14px;font-weight:700}.links a{background:#e7edf4;color:var(--blue)}.signin{background:var(--blue2);color:#fff}.hidden{display:none}
  </style>
</head>
<body>
  <header class="top"><strong>Edgefield County TimeClock</strong><small>Mobile Quick Punch</small></header>
  <main>
    <section id="signedOut" class="card hidden">
      <h2>Sign in required</h2>
      <p class="muted">Use your County Employee Portal account. After sign-in, return to Mobile Quick Punch.</p>
      <a class="signin" href="https://employee.edgefieldcountysc.org/apps/timeclock/launch?return_to=mobile">Sign In</a>
    </section>

    <section id="app" class="card state hidden">
      <div id="employee" class="muted"></div>
      <h1 id="stateText">Checking status…</h1>
      <div id="lastPunch" class="last muted"></div>
      <button id="punchButton" class="punch" disabled>Loading…</button>
      <div id="captureStatus" class="status">GPS will be requested fresh when you punch. Your network IP is recorded by the server.</div>
    </section>

    <section class="card links">
      <a href="/employee.html">Full TimeClock</a>
      <a href="/index.html">TimeClock Home</a>
    </section>
  </main>
  <script>
    const apiBase='/api';
    let currentStatus=null;
    const token=()=>localStorage.getItem('timeclock_token');
    const authHeaders=()=>({Authorization:`Bearer ${token()}`,'Content-Type':'application/json'});
    const el=id=>document.getElementById(id);

    function showSignedOut(){el('signedOut').classList.remove('hidden');el('app').classList.add('hidden')}
    function setMessage(message,kind=''){const box=el('captureStatus');box.className=`status ${kind}`.trim();box.textContent=message}
    function formatTime(value){if(!value)return 'No previous punch recorded';return new Date(value).toLocaleString([], {dateStyle:'medium',timeStyle:'short'})}

    async function load(){
      if(!token()){showSignedOut();return}
      try{
        const me=await fetch(`${apiBase}/me`,{headers:{Authorization:`Bearer ${token()}`}});
        if(me.status===401){localStorage.removeItem('timeclock_token');showSignedOut();return}
        if(!me.ok)throw new Error('Unable to load employee session');
        const userData=await me.json();
        el('employee').textContent=`${userData.user.first_name} ${userData.user.last_name}`;
        el('signedOut').classList.add('hidden');el('app').classList.remove('hidden');
        await refreshStatus();
      }catch(err){setMessage(err.message||'Unable to load TimeClock','warn')}
    }

    async function refreshStatus(){
      const response=await fetch(`${apiBase}/quick-status`,{headers:{Authorization:`Bearer ${token()}`}});
      if(response.status===401){localStorage.removeItem('timeclock_token');showSignedOut();return}
      const data=await response.json();
      if(!response.ok)throw new Error(data.error||'Unable to read punch status');
      currentStatus=data;
      el('stateText').textContent=data.clocked_in?'You are CLOCKED IN':'You are CLOCKED OUT';
      el('lastPunch').textContent=data.last_punch_at?`Last punch: ${formatTime(data.last_punch_at)}`:'No previous punch recorded';
      const button=el('punchButton');button.disabled=false;button.textContent=data.clocked_in?'CLICK HERE TO CLOCK OUT':'CLICK HERE TO CLOCK IN';
    }

    function freshLocation(){
      return new Promise(resolve=>{
        if(!navigator.geolocation){resolve({location_status:'unavailable'});return}
        navigator.geolocation.getCurrentPosition(
          pos=>resolve({
            location_status:'captured',
            latitude:pos.coords.latitude,
            longitude:pos.coords.longitude,
            accuracy_meters:pos.coords.accuracy
          }),
          err=>{
            const status=err.code===1?'denied':err.code===3?'timeout':'error';
            resolve({location_status:status});
          },
          {enableHighAccuracy:true,maximumAge:0,timeout:12000}
        );
      });
    }

    async function punch(){
      if(!currentStatus)return;
      const button=el('punchButton');button.disabled=true;button.textContent='GETTING CURRENT LOCATION…';
      setMessage('Requesting a fresh GPS reading for this punch…');
      const location=await freshLocation();
      if(location.location_status==='captured') setMessage(`GPS captured (accuracy about ${Math.round(location.accuracy_meters||0)} m). Submitting punch…`);
      else setMessage(`GPS ${location.location_status}. The punch will still be submitted and the status will be recorded.`,'warn');

      try{
        const endpoint=currentStatus.clocked_in?'clock-out':'clock-in';
        const response=await fetch(`${apiBase}/${endpoint}`,{
          method:'POST',headers:authHeaders(),body:JSON.stringify({...location,client_source:'mobile_pwa'})
        });
        const data=await response.json();
        if(response.status===401){localStorage.removeItem('timeclock_token');showSignedOut();return}
        if(!response.ok)throw new Error(data.error||'Punch failed');
        setMessage(data.metadata_recorded===false?'Punch saved, but location/network metadata could not be recorded.':'Punch saved successfully. IP and location status were recorded.','ok');
        await refreshStatus();
      }catch(err){setMessage(err.message||'Punch failed','warn');button.disabled=false;button.textContent=currentStatus.clocked_in?'CLICK HERE TO CLOCK OUT':'CLICK HERE TO CLOCK IN'}
    }

    el('punchButton').addEventListener('click',punch);
    if('serviceWorker' in navigator)navigator.serviceWorker.register('/mobile-sw.js').catch(()=>{});
    load();
  </script>
</body>
</html>
