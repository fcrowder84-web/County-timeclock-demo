<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Printable Payroll Timecards</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 20px;
        }

        .topbar {
            background: white;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 10px;
        }

        .btn-primary {
            background: #1f3c5b;
            color: white;
        }

        .btn-print {
            background: #27ae60;
            color: white;
        }

        .btn-home {
            background: #566573;
            color: white;
        }

        .timecard {
            background: white;
            padding: 8px;
            margin-bottom: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
            page-break-after: always;
        }

        .header {
            border-bottom: 2px solid #1f3c5b;
            margin-bottom: 20px;
            padding-bottom: 10px;
        }

        .header h1 {
            margin: 0;
            color: #1f3c5b;
        }

        .employee-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .info-box {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 8px;
        }

        .week-box {
            border: 2px solid #1f3c5b;
            border-radius: 8px;
            margin-top: 20px;
            overflow: hidden;
        }

        .week-header {
            background: #1f3c5b;
            color: white;
            padding: 10px 14px;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 4px;
            border: 1px solid #ccc;
            text-align: center;
            white-space: nowrap;
            font-size: 11px;
        }

        th:first-child, td:first-child { text-align:left; }

        th {
            background: #ececec;
        }

        .day-a {
            background: #ffffff;
        }

        .day-b {
            background: #f1f6fb;
        }

        .week-total {
            background: #eaf3ea;
            font-weight: bold;
        }

        .period-total {
            margin-top: 20px;
            background: #eef2f7;
            border: 2px solid #333;
            padding: 15px;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
        }

        .signatures {
            margin-top: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
        }

        .signature-box {
            border-top: 1px solid #333;
            padding-top: 8px;
            min-height: 50px;
        }

        .status-approved {
            color: #155724;
            font-weight: bold;
        }

        .status-submitted {
            color: #856404;
            font-weight: bold;
        }

        .status-pending {
            color: #721c24;
            font-weight: bold;
        }

        @media print {
            @page {
                size: letter landscape;
                margin: 0.3in;
            }

            body {
               zoom: 0.72;
            }           
            
            body {
                background: white;
                padding: 0;
            }

            .topbar {
                display: none;
            }

            .timecard {
                box-shadow: none;
                border: none;
                margin: 0;
                padding: 10px;
            }
        }
    </style>
<link rel="stylesheet" href="/app-shell.css?v=20260923-1">
</head>

<body>

    <div class="topbar">
        <button class="btn-primary" onclick="loadTimecards()">Refresh</button>
        <button class="btn-print" onclick="window.print()">Print / Save PDF</button>
        <button class="btn-home" onclick="goHome()">Home</button>
    </div>

    <div id="timecardsContainer"></div>

    <script src="/safe-html.js"></script>
    <script>
        const apiBase = "/api";
        const esc = SafeHtml.escape;
        const selectedPeriodStart = new URLSearchParams(window.location.search).get("periodStart") || null;
        let loadedPeriodStart = selectedPeriodStart;

        function withSelectedPeriod(url) {
            if (!selectedPeriodStart || !url.startsWith(apiBase)) return url;
            const separator = url.includes("?") ? "&" : "?";
            return `${url}${separator}period_start=${encodeURIComponent(selectedPeriodStart)}`;
        }

        function getToken() {
            return localStorage.getItem("timeclock_token");
        }

        async function apiFetch(url, options = {}) {
            const token = getToken();

            const headers = {
                ...(options.headers || {})
            };

            if (token) {
                headers["Authorization"] = `Bearer ${token}`;
            }

            url = withSelectedPeriod(url);

            const response = await fetch(url, {
                ...options,
                headers
            });

            if (response.status === 401) {
                alert("Login required");
                window.location.href = "/payroll.html";
                throw new Error("Login required");
            }

            if (response.status === 403) {
                alert("You do not have permission to print payroll timecards");
                window.location.href = "/index.html";
                throw new Error("Permission denied");
            }

            return response;
        }

        function goHome() {
            window.location.href = "/index.html";
        }

        function getStatusClass(status) {
            if (status === "supervisor_approved") return "status-approved";
            if (status === "employee_submitted") return "status-submitted";
            return "status-pending";
        }

        function groupByEmployee(rows) {
            const grouped = {};

            rows.forEach(row => {
                if (!grouped[row.employee_id]) {
                    grouped[row.employee_id] = {
                        employee: row,
                        entries: []
                    };
                }

                if (row.time_entry_id) {
                    grouped[row.employee_id].entries.push(row);
                }
            });

            return grouped;
        }

        function num(value) { return Number(value || 0); }
        function fmt(value) { return num(value).toFixed(2); }
        function dateOnly(value) { return String(value || "").slice(0, 10); }
        function otherTotal(map) {
            return Object.entries(map || {})
                .filter(([key]) => !["holiday","vacation","sick","floating_holiday"].includes(key))
                .reduce((sum,[,value]) => sum + num(value), 0);
        }
        function leaveHours(leaves, day, type) {
            return leaves
                .filter(item => dateOnly(item.leave_date_iso) === day && item.status === "approved")
                .filter(item => type === "other"
                    ? !["holiday","vacation","sick","floating_holiday"].includes(item.leave_type)
                    : item.leave_type === type)
                .reduce((sum,item) => sum + num(item.quarter_hours) / 4, 0);
        }
        function punchList(entries) {
            const punches = [];
            entries.forEach(entry => {
                if (entry.clock_in) punches.push(entry.clock_in);
                punches.push(entry.clock_out || "OPEN");
            });
            return punches;
        }
        function totalRow(label, summary, className) {
            const leave = summary?.leave_hours_by_type || {};
            return `<tr class="${className}">
                <td colspan="2"><strong>${esc(label)}</strong></td>
                <td>${fmt(num(summary?.regular_worked_hours) + num(summary?.forced_lunch_hours))}</td>
                <td>${num(summary?.forced_lunch_hours) ? "-" + fmt(summary.forced_lunch_hours) : ""}</td>
                <td>${fmt(summary?.overtime_hours)}</td>
                <td>${fmt(leave.holiday)}</td>
                <td>${fmt(leave.vacation)}</td>
                <td>${fmt(leave.sick)}</td>
                <td>${fmt(leave.floating_holiday)}</td>
                <td>${fmt(otherTotal(leave))}</td>
                <td><strong>${fmt(summary?.total_paid_hours)}</strong></td>
            </tr>`;
        }
        function renderEmployeeTable(employeeId, entries, leaves, summary, periodStart) {
            const entryMap = {};
            entries.forEach(entry => {
                const day = dateOnly(entry.work_date_iso);
                (entryMap[day] ||= []).push(entry);
            });
            const daySummary = Object.fromEntries((summary?.days || []).map(day => [day.work_date, day]));
            const rows = [];
            let weekWorked = 0;
            for (let offset = 0; offset < 14; offset++) {
                const date = new Date(`${periodStart}T12:00:00`);
                date.setDate(date.getDate() + offset);
                const day = date.toISOString().slice(0,10);
                const dayEntries = entryMap[day] || [];
                const punches = punchList(dayEntries);
                const worked = num(daySummary[day]?.total_worked_hours);
                const forced = num(daySummary[day]?.forced_lunch_deduction_hours);
                const remaining = Math.max(0, 40 - weekWorked);
                const regular = Math.min(worked, remaining);
                const ot = Math.max(0, worked - regular);
                weekWorked += worked;
                const holiday = leaveHours(leaves, day, "holiday");
                const vacation = leaveHours(leaves, day, "vacation");
                const sick = leaveHours(leaves, day, "sick");
                const floating = leaveHours(leaves, day, "floating_holiday");
                const other = leaveHours(leaves, day, "other");
                const paid = worked + holiday + vacation + sick + floating + other;
                rows.push(`<tr class="${offset % 2 ? "day-b" : "day-a"}">
                    <td>${date.toLocaleDateString([], {weekday:"short",month:"numeric",day:"numeric"})}</td>
                    <td>${punches.map(esc).join(" · ")}</td>
                    <td>${fmt(regular + forced)}</td>
                    <td>${forced ? "-" + fmt(forced) : ""}</td>
                    <td>${fmt(ot)}</td>
                    <td>${holiday ? fmt(holiday) : ""}</td>
                    <td>${vacation ? fmt(vacation) : ""}</td>
                    <td>${sick ? fmt(sick) : ""}</td>
                    <td>${floating ? fmt(floating) : ""}</td>
                    <td>${other ? fmt(other) : ""}</td>
                    <td>${fmt(paid)}</td>
                </tr>`);
                if (offset === 6) {
                    rows.push(totalRow("Week 1 Totals", summary?.weeks?.[0], "week-total"));
                    weekWorked = 0;
                }
                if (offset === 13) rows.push(totalRow("Week 2 Totals", summary?.weeks?.[1], "week-total"));
            }
            rows.push(totalRow("Pay Period Totals", summary?.period, "week-total"));
            return `<table>
                <thead><tr>
                    <th>Day / Date</th><th>Punches</th><th>Regular</th><th>Forced Lunch</th><th>OT</th>
                    <th>Holiday</th><th>Vacation</th><th>Sick</th><th>Floating</th><th>Other</th><th>Total</th>
                </tr></thead>
                <tbody>${rows.join("")}</tbody>
            </table>`;
        }

        async function loadTimecards() {
            const response = await apiFetch(`${apiBase}/payroll/print-timecards`);
            const data = await response.json();
            loadedPeriodStart = data.pay_period_start;
            const grouped = groupByEmployee(data.rows);
            const allLeaves = data.leave_entries || [];
            let html = "";

            Object.values(grouped).forEach(group => {
                const employee = group.employee;
                const employeeId = Number(employee.employee_id);
                const summary = (data.timecard_summaries || {})[employeeId] || {};
                const leaves = allLeaves.filter(item => Number(item.employee_id) === employeeId);
                html += `
                    <div class="timecard">
                        <div class="header">
                            <h1>Edgefield County Timecard</h1>
                            <div>Pay Period: ${esc(data.pay_period_start)} through ${esc(data.pay_period_end)}</div>
                        </div>
                        <div class="employee-info">
                            <div class="info-box"><strong>Employee</strong><br>${esc(employee.first_name)} ${esc(employee.last_name)}</div>
                            <div class="info-box"><strong>Employee Number</strong><br>${esc(employee.employee_number)}</div>
                            <div class="info-box"><strong>Department</strong><br>${esc(employee.department || "-")}</div>
                            <div class="info-box"><strong>Status</strong><br><span class="${getStatusClass(employee.approval_status)}">${esc(employee.approval_status || "pending")}</span></div>
                        </div>
                        ${renderEmployeeTable(employeeId, group.entries, leaves, summary, data.pay_period_start)}
                        <div class="signatures">
                            <div class="signature-box"><strong>Employee Approval</strong><br><br>Submitted: ${esc(employee.employee_signed_at || "Not Submitted")}</div>
                            <div class="signature-box"><strong>Supervisor Approval</strong><br><br>Approved: ${esc(employee.supervisor_approved_at || "Not Approved")}</div>
                        </div>
                    </div>`;
            });
            document.getElementById("timecardsContainer").innerHTML = html;
        }

        loadTimecards();
    </script>

<script src="/app-shell.js?v=20260923-1"></script>
</body>

</html>
